<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#232c3c"/>
      <stop offset="55%" stop-color="#161b26"/>
      <stop offset="100%" stop-color="#0e1119"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4b45c"/>
      <stop offset="100%" stop-color="#dd8f24"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.32" cy="0.25" r="0.9">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- squircle background -->
  <rect x="64" y="64" width="896" height="896" rx="204" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="204" fill="url(#glow)"/>
  <rect x="70" y="70" width="884" height="884" rx="198" fill="none"
        stroke="#ffffff" stroke-opacity="0.08" stroke-width="12"/>

  <!-- branch graph: trunk with a branch that merges back -->
  <g stroke-linecap="round" fill="none">
    <!-- trunk line -->
    <path d="M400 268 V 756" stroke="#55627a" stroke-width="58"/>
    <!-- branch out and merge back -->
    <path d="M400 380 C 400 470, 624 452, 624 548 L 624 560"
          stroke="url(#amber)" stroke-width="58"/>
    <path d="M624 560 C 624 664, 400 640, 400 700"
          stroke="url(#amber)" stroke-width="58" stroke-opacity="0.55"/>
  </g>

  <!-- nodes -->
  <g>
    <circle cx="400" cy="268" r="86" fill="#55627a"/>
    <circle cx="400" cy="268" r="86" fill="none" stroke="#0e1119" stroke-width="0"/>
    <circle cx="400" cy="268" r="44" fill="#161b26"/>

    <circle cx="400" cy="756" r="86" fill="#55627a"/>
    <circle cx="400" cy="756" r="44" fill="#161b26"/>

    <circle cx="624" cy="560" r="96" fill="url(#amber)"/>
    <circle cx="624" cy="560" r="48" fill="#161b26"/>
  </g>
</svg>
